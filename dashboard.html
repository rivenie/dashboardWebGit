<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Dashboard Flota | Estatus de Unidades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Cargando dashboard…</p>
    </div>

    <header class="topbar" id="topbar" hidden>
        <div class="brand">
            <div class="brand-text">
                <strong>FLOTA</strong>
                <span>| Estatus de Unidades</span>
            </div>
        </div>
        <div class="chips">
            <div class="chip"><span>Unidades</span><b id="chipRegistros">—</b></div>
            <div class="chip"><span>Última sinc.</span><b id="chipSync">—</b></div>
        </div>
        <div class="topbar-right">
            <span class="live"><i></i>Datos en vivo</span>
            <button type="button" class="icon-btn js-refresh" title="Actualizar datos">
                <i class="fas fa-rotate"></i>
            </button>
        </div>
    </header>

    <div class="shell" id="shell" hidden>
        <aside class="sidebar">
            <p class="nav-label">Paneles</p>
            <nav class="tabs" id="dashTabs" aria-label="Secciones">
                <a href="#" class="tab active" data-seccion="flota"><i class="fas fa-truck"></i><span>Flota</span></a>
            </nav>
            <p class="nav-label">Sistema y reportes</p>
            <div class="nav-actions">
                <button type="button" class="nav-btn js-refresh"><i class="fas fa-rotate"></i><span>Actualizar datos</span></button>
            </div>
            <div class="status-card">
                <h4>Fuente de datos</h4>
                <p class="status-sub">Supabase · dashboard_data</p>
                <div class="bar"><i style="width:100%"></i></div>
                <dl>
                    <div><dt>Tablas cargadas</dt><dd id="stRegistros">—</dd></div>
                    <div><dt>Sincronizado</dt><dd id="stSync">—</dd></div>
                </dl>
            </div>
        </aside>

        <main class="main">
            <section id="flota" class="dashboard-section" hidden>
                <div class="page-head">
                    <div>
                        <h1>Estatus de Unidades</h1>
                        <p>Operativas · Inoperativas · Días · Responsables</p>
                    </div>
                </div>

                <nav class="subtabs" id="subTabsC">                    
                    <button type="button" class="subtab active" data-sub="resumen"><i class="fas fa-chart-pie"></i> Resumen</button>
                    <button type="button" class="subtab" data-sub="detalle"><i class="fas fa-table"></i> Detalle</button>
                    <button type="button" class="subtab" data-sub="taller"><i class="fas fa-wrench"></i> Taller</button>
                </nav>

                <div id="subC-taller" class="subseccion" style="display:none;">
    <section class="charts-exec" id="gridTaller"></section>
</div>

                <div id="subC-resumen" class="subseccion">
                    <section class="filters-row" id="filtersCompRes"></section>
                    <section class="kpi-row" id="kpiCompRes"></section>
                    <section class="charts-exec" id="gridCompRes"></section>
                </div>

                <div id="subC-detalle" class="subseccion" style="display:none;">
                    <section class="filters-row" id="filtersCompDet"></section>
                    <section class="charts-exec" id="gridCompDet"></section>
                </div>
            </section>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
